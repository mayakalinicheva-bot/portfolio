<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1950ff">
  <title>portfolio / Discovery workspace</title>
  <link rel="stylesheet" href="styles.css">
  <script src="model.js" defer></script>
  <script src="workspace.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>
  <aside class="sidebar" id="sidebar" aria-label="Рабочее пространство">
    <a class="brand" href="#/home"><span class="brand-symbol">p<span>·</span></span>portfolio<span class="brand-label">LAB</span></a>
    <div class="workspace-card"><span class="workspace-icon">P</span><div><strong>portfolio</strong><small>Продуктовый Discovery</small></div><span class="workspace-dot"></span></div>
    <nav id="navigation" aria-label="Разделы"></nav>
    <div class="sidebar-bottom"><button data-action="export" class="sidebar-utility" id="backupButton"></button><button data-action="import" class="sidebar-utility" id="importButton"></button><div class="storage-note"><span class="live-dot"></span><div id="storageDescription">Загрузка рабочего пространства…</div></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" data-action="menu" aria-label="Открыть меню">☰</button><button class="icon-button" data-action="back" aria-label="Назад" title="Назад" id="backButton"></button><div class="breadcrumbs" id="breadcrumbs"></div></div><div class="topbar-right"><button class="search-launch" data-action="search"><span id="searchIcon"></span><span>Найти в пространстве</span><kbd>⌘ K</kbd></button><button class="button primary" data-action="create">+ Создать</button></div></header>
    <div id="saveError" role="alert" hidden></div>
    <main id="content" class="content" tabindex="-1"><div class="loading"><span class="spinner"></span>Собираем рабочее пространство…</div></main>
    <footer class="page-footer"><span>portfolio · Discovery workspace</span><span id="saveStatus" role="status" aria-live="polite">Загрузка…</span></footer>
  </div>
  <dialog id="dialog"></dialog><input id="importFile" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
